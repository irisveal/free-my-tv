name: Build APK

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Город (например: Moscow)"
        default: "Moscow"
      latitude:
        description: "Широта (например: 55.7558)"
        default: "55.7558"
      longitude:
        description: "Долгота (например: 37.6173)"
        default: "37.6173"
      tmdb_region:
        description: "Код страны (RU, KZ, UA, BY...)"
        default: "RU"
      language:
        description: "Язык (auto, ru, en...)"
        default: "auto"
      currency:
        description: "Валюта для крипто-карточки (USD, RUB...)"
        default: "USD"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34"

      - name: Write config.properties
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          cat > config.properties <<EOF
          tmdb_key=${TMDB_KEY}
          tmdb_region=${{ inputs.tmdb_region }}
          city=${{ inputs.city }}
          latitude=${{ inputs.latitude }}
          longitude=${{ inputs.longitude }}
          language=${{ inputs.language }}
          currency=${{ inputs.currency }}
          EOF
          sed -i 's/^[[:space:]]*//' config.properties

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
